# Release pipeline: build x86_64 + aarch64 Linux binaries for a `v*` tag
# and attach tarballs to a GitHub Release. Builds run inside Arch containers
# (native arch per runner) so the binaries match the glibc of the alarm pacman
# repo's consumers — NOT musl: the gpui fork's wayland/wgpu stack on musl is
# uncharted.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            container: archlinux:base-devel
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: archlinuxarm:base-devel
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm git rustup fontconfig pkgconf
          rustup default stable
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p "pkg/upperadd" dist
          cp target/release/upperadd pkg/upperadd/
          cp README.md LICENSE pkg/upperadd/
          # Packaged installs run from /usr/bin, not the dev checkout.
          sed 's#/x/g/upperadd/target/release/upperadd#/usr/bin/upperadd#' \
            dist/upperadd.service > pkg/upperadd/upperadd.service
          tar -czf "dist/upperadd-${ver}-linux-${ARCH}.tar.gz" -C pkg upperadd
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
