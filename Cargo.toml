[package]
name = "upperadd"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Wayland overlay to jump into markdown notes: fuzzy search, live preview, editor handoff"

[dependencies]
# gpui-ce fork via git tag (portable form; see /g/gpui-ce/MDRV.md §Registry).
# Dep keys stay gpui/gpui_platform so `use` paths are unchanged.
gpui = { package = "mdrv-gpui-ce", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.4" }
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925.4", features = [
	"wayland",
] }
mdrv-db = { version = "0.5.1", features = ["turso"] } # engine crate; TursoPort via the 0.5.1 export

anyhow = "1"
blake3 = "1" # restart-stable section content hashes (std hasher is per-process seeded)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
notify = "8" # spec-mandated fs-watch: incremental index updates on note saves
pulldown-cmark = "0.13" # spec-mandated GFM markdown parser for the preview pane
serde = { version = "1", features = ["derive"] }
serde_json = "1" # parse `hyprctl monitors -j` for cursor-output resolution
toml = "0.9"

[patch.crates-io]
arrayref = { git = "https://github.com/mdrv/gpui-ce" } # crates.io arrayref is yanked/broken (via tiny-skia)
